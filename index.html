<section class="exposure-check" aria-labelledby="exposure-title">
  <h2 id="exposure-title">Verificar exposição de senha</h2>

  <p>
    Verifica se esta senha consta na base de dados de senhas expostas,
    sem enviar a senha original.
  </p>

  <form id="exposure-form">
    <label for="exposure-password">Senha a verificar</label>

    <div class="exposure-input-group">
      <input
        id="exposure-password"
        type="password"
        autocomplete="off"
        spellcheck="false"
        required
        aria-describedby="exposure-help"
        placeholder="Introduz uma senha"
      />

      <button id="exposure-toggle" type="button"
        aria-label="Mostrar senha">
        Mostrar
      </button>
    </div>

    <p id="exposure-help">
      A verificação só começa quando carregares no botão.
    </p>

    <button id="exposure-submit" type="submit">
      Verificar exposição
    </button>

    <p id="exposure-status" role="status" aria-live="polite"></p>
  </form>
</section>
